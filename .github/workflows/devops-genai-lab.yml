# Laboratorio DevOps + GenAI (Curso 14 - Unidade 5)
# Equivalente ao .gitlab-ci.yml do laboratorio, adaptado para GitHub Actions.
#
#   stage test           -> job unit_test    (falha por causa do bug intencional)
#   stage genai_analysis -> job ai_debugger  (roda somente se o teste falhar)

name: DevOps GenAI Lab

on:
  push:
    paths:
      - 'labs/devops-genai-lab/**'
      - '.github/workflows/devops-genai-lab.yml'
  pull_request:
    paths:
      - 'labs/devops-genai-lab/**'
      - '.github/workflows/devops-genai-lab.yml'

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: labs/devops-genai-lab

jobs:
  unit_test:
    name: unit_test (stage test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar testes unitarios
        id: pytest
        run: |
          set -o pipefail
          pytest -v --tb=long 2>&1 | tee pytest-output.log

      - name: Publicar trace do job como artefato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-trace
          path: labs/devops-genai-lab/pytest-output.log

  ai_debugger:
    name: ai_debugger (stage genai_analysis)
    runs-on: ubuntu-latest
    needs: unit_test
    # Equivalente ao `when: on_failure` do GitLab CI.
    if: failure()
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar trace do job de testes
        uses: actions/download-artifact@v4
        with:
          name: pytest-trace
          path: labs/devops-genai-lab

      - name: Obter diff do Pull Request
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }}...HEAD -- . > pr.diff || true
          echo "--- diff coletado ---"
          head -40 pr.diff

      - name: Analisar falha com IA generativa
        env:
          # Chaves vem dos secrets do repositorio; o GitHub mascara os valores no log.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRACE_FILE: pytest-output.log
          DIFF_FILE: pr.diff
        run: python genai_analyst.py

      - name: Publicar analise como comentario no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'labs/devops-genai-lab/analise-genai.md';
            if (!fs.existsSync(path)) {
              core.info('Nenhuma analise gerada.');
              return;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync(path, 'utf8'),
            });

      - name: Publicar analise no resumo da execucao
        if: always()
        run: cat analise-genai.md >> "$GITHUB_STEP_SUMMARY" || true
